name: AHX x402 offline quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated API dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        env:
          PAYMENT_MODE: disabled
          INTELLIGENCE_PROVIDER: stub
          APP_ENV: test
        run: python -m pytest -q
